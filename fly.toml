# Fly.io config for Dream.
#
# IMPORTANT: run at most ONE machine. The store is SQLite + files on a local
# volume; a second machine would see a different (or corrupted) memory.
#
# First-time setup (once, from any terminal with flyctl). Use `fly deploy`,
# NOT `fly launch` — launch re-plans the config and proposes 2 machines for
# high availability, which both breaks the single-machine requirement and can
# exceed a new organization's machine limit.
#
#   fly apps create agentic-dream            # pick your own unique name, put it below
#   fly volumes create dream_data --size 1 --region ams
#   fly secrets set DREAM_ACCESS_TOKEN=<choose-a-strong-token>
#   fly deploy --ha=false
#
# If Fly says "requested machine count exceeds organization limit", add a
# payment method first (fly.io dashboard → Billing) — new organizations
# cannot place machines until one is on file.
app = "agentic-dream"
primary_region = "ams"

[build]

[env]
  PORT = "8082"
  DREAM_STORE_DIR = "/data/dream-store"

[mounts]
  source = "dream_data"
  destination = "/data"

[http_service]
  internal_port = 8082
  force_https = true
  # Keep the machine alive: the consolidation scheduler and the in-memory
  # keyring live in-process. Auto-stop would silently disable dreaming.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
