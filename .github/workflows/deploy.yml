name: test-and-deploy

on:
  push:
    branches: [main, 'claude/hosting-proxy-ui-gumbb8']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The eval harness is the regression gate: retention thresholds fail CI.
      - run: npm run eval

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Check for Fly token
        id: fly
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN secret not set — skipping deploy. Add it in repo Settings → Secrets to enable."
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.have_token == 'true'
      - name: Deploy to Fly.io
        if: steps.fly.outputs.have_token == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
